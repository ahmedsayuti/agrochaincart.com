<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace — AgroChain Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <style>
        :root {
            --forest: #1a3a2a; --grove: #2d6a4f; --leaf: #40916c; --sage: #74c69d;
            --mist: #d8f3dc; --cream: #f8faf4; --smoke: #4a5e52; --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--cream); padding-top: 60px;
        }
        nav {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: white; display: flex; align-items: center; padding: 0 5%;
            border-bottom: 1px solid #e0e0e0; z-index: 100;
        }
        .nav-logo { font-family: 'Lora', serif; font-weight: 600; font-size: 1.2rem; color: var(--forest); text-decoration: none; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 5%; }
        .filters { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
        .filter-btn {
            padding: 8px 18px; border-radius: 100px; border: 1.5px solid #ddeee4;
            background: white; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .filter-btn.active { background: var(--grove); color: white; border-color: var(--grove); }
        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px;
        }
        .product-card {
            background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e8f0eb;
            transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; position: relative;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
        .product-img {
            height: 160px; background: var(--mist); display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .product-body { padding: 16px; }
        .product-name { font-weight: 700; color: var(--forest); }
        .product-farm { font-size: 0.85rem; color: var(--smoke); margin-bottom: 8px; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .product-price { font-weight: 800; color: var(--grove); }
        .btn-order {
            padding: 6px 14px; border-radius: 6px; background: var(--grove);
            color: white; font-weight: 600; border: none; cursor: pointer;
        }
        .btn-order:hover { background: var(--forest); }
        .favorite-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255,255,255,0.85); border: none;
            font-size: 1.2rem; cursor: pointer; padding: 4px 8px;
            border-radius: 50%; backdrop-filter: blur(4px);
            transition: transform 0.2s;
        }
        .favorite-btn:hover { transform: scale(1.2); }
        .favorite-btn.faved { color: #e74c3c; }

        .loading, .error { text-align: center; padding: 40px; color: var(--smoke); }

        /* Modal for product detail */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 16px; padding: 32px; max-width: 500px; width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2); text-align: center;
        }
        .modal img { max-width: 100%; border-radius: 12px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-logo">Agro<span style="color:var(--grove);">Chain</span><span class="cart">Cart</span></a>
        <a href="/dashboard/" style="margin-left:auto;">Dashboard</a>
    </nav>

    <div class="container">
        <h1 style="color:var(--forest); margin-bottom:8px;">Live Marketplace</h1>
        <p style="color:var(--smoke);">Fresh produce directly from verified farms.</p>

        <div class="filters" id="filters">
            <button class="filter-btn active" onclick="filterProducts('all', this)">All</button>
            <button class="filter-btn" onclick="filterProducts('vegetables', this)">Vegetables</button>
            <button class="filter-btn" onclick="filterProducts('fruits', this)">Fruits</button>
            <button class="filter-btn" onclick="filterProducts('dairy', this)">Dairy</button>
            <button class="filter-btn" onclick="filterProducts('grains', this)">Grains</button>
        </div>

        <div class="products-grid" id="productsGrid">
            <div class="loading">Loading fresh produce...</div>
        </div>
    </div>

    <!-- Product detail modal -->
    <div class="modal-overlay" id="detailModal" onclick="closeDetailModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <img id="detailImage" src="" alt="">
            <h2 id="detailTitle" style="color:var(--forest);"></h2>
            <p id="detailFarm" style="color:var(--smoke);"></p>
            <p id="detailDesc" style="color:var(--smoke); margin:12px 0;"></p>
            <p id="detailPrice" style="font-weight:800; color:var(--grove); font-size:1.2rem;"></p>
            <button class="btn-order" id="detailOrderBtn" onclick="placeOrderFromDetail()">Order</button>
            <button class="btn-order outline" style="margin-left:8px;" onclick="closeDetailModal()">Close</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const supabase = window.supabase.createClient(
                'https://kuwoqzdgndnnayxrbzll.supabase.co',
                'sb_publishable_jA1Bj9q3UEQbNOrDqn-0Wg_VxcviUCE'
            );
            let allProducts = [];
            let userFavorites = new Set(); // farmer_ids that the current user has favorited

            async function loadProducts() {
                const grid = document.getElementById('productsGrid');
                grid.innerHTML = '<div class="loading">Loading fresh produce...</div>';

                // Load user's favorites if logged in
                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    const { data: favs } = await supabase.from('favorites')
                        .select('farmer_id')
                        .eq('buyer_id', user.id);
                    userFavorites = new Set(favs?.map(f => f.farmer_id) || []);
                }

                const { data, error } = await supabase
                    .from('listings')
                    .select('*, profiles!inner(first_name, last_name, state)')
                    .gt('quantity_available', 0)
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Marketplace error:', error);
                    grid.innerHTML = `<div class="error">Couldn't load marketplace. ${error.message}. Please try again later.</div>`;
                    return;
                }

                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="loading">No listings found. Be the first to add one!</div>';
                    return;
                }

                allProducts = data;
                renderProducts('all');
            }

            function renderProducts(category) {
                const filtered = category === 'all' ? allProducts : allProducts.filter(p => p.category === category);
                const grid = document.getElementById('productsGrid');

                if (!filtered.length) {
                    grid.innerHTML = '<div class="loading">No listings in this category.</div>';
                    return;
                }

                grid.innerHTML = filtered.map(p => {
                    const farmerName = p.profiles ? `${p.profiles.first_name} ${p.profiles.last_name}` : 'Unknown farm';
                    const farmerState = p.profiles ? p.profiles.state : '';
                    const imageUrl = p.image_url;
                    const isFaved = userFavorites.has(p.farmer_id);

                    return `
                    <div class="product-card" onclick="openDetail('${p.id}')">
                        <div class="product-img">
                            ${imageUrl 
                                ? `<img src="${imageUrl}" alt="${escapeHtml(p.title)}" loading="lazy" />`
                                : '<span style="font-size:2rem;">🌱</span>'
                            }
                        </div>
                        <div class="product-body">
                            <div class="product-name">${escapeHtml(p.title)}</div>
                            <div class="product-farm">${escapeHtml(farmerName)}${farmerState ? ' — ' + escapeHtml(farmerState) : ''}</div>
                            <div class="product-footer">
                                <div class="product-price">$${p.price}/${p.unit}</div>
                                <button class="btn-order" onclick="event.stopPropagation(); placeOrder('${p.id}', '${escapeHtml(p.title)}', ${p.price})">Order</button>
                            </div>
                        </div>
                        <button class="favorite-btn ${isFaved ? 'faved' : ''}" 
                            onclick="event.stopPropagation(); toggleFavorite('${p.farmer_id}', this)"
                            title="Favorite this farm">
                            ${isFaved ? '❤️' : '🤍'}
                        </button>
                    </div>
                    `;
                }).join('');
            }

            window.filterProducts = function(cat, btn) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderProducts(cat);
            };

            async function placeOrder(listingId, title, price) {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    alert('Please sign in to order.');
                    window.location.href = '/sign-in/';
                    return;
                }
                const quantity = prompt(`How many? ($${price}/unit)`, '1');
                if (!quantity) return;
                const { error } = await supabase.from('orders').insert([{
                    buyer_id: user.id,
                    listing_id: listingId,
                    quantity: parseFloat(quantity),
                    total_price: parseFloat(quantity) * price
                }]);
                if (error) alert('Order error: ' + error.message);
                else alert('Order placed!');
            }

            // Expose for inline handlers
            window.placeOrder = placeOrder;

            // Favorite toggle
            window.toggleFavorite = async function(farmerId, btn) {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    alert('Please sign in to favorite farms.');
                    return;
                }
                if (userFavorites.has(farmerId)) {
                    // Remove from favorites
                    const { error } = await supabase.from('favorites')
                        .delete()
                        .eq('buyer_id', user.id)
                        .eq('farmer_id', farmerId);
                    if (error) { alert('Error: ' + error.message); return; }
                    userFavorites.delete(farmerId);
                    btn.classList.remove('faved');
                    btn.innerHTML = '🤍';
                } else {
                    // Add to favorites
                    const { error } = await supabase.from('favorites')
                        .insert([{ buyer_id: user.id, farmer_id: farmerId }]);
                    if (error) { alert('Error: ' + error.message); return; }
                    userFavorites.add(farmerId);
                    btn.classList.add('faved');
                    btn.innerHTML = '❤️';
                }
            };

            // Product detail modal
            window.openDetail = function(listingId) {
                const listing = allProducts.find(p => p.id === listingId);
                if (!listing) return;
                document.getElementById('detailTitle').textContent = listing.title;
                document.getElementById('detailFarm').textContent = 
                    `${listing.profiles.first_name} ${listing.profiles.last_name} — ${listing.profiles.state}`;
                document.getElementById('detailDesc').textContent = listing.description || 'No description available.';
                document.getElementById('detailPrice').textContent = `$${listing.price} / ${listing.unit}`;
                const imgEl = document.getElementById('detailImage');
                if (listing.image_url) {
                    imgEl.src = listing.image_url;
                    imgEl.style.display = 'block';
                } else {
                    imgEl.style.display = 'none';
                }
                document.getElementById('detailOrderBtn').onclick = () => {
                    placeOrder(listing.id, listing.title, listing.price);
                    closeDetailModal();
                };
                document.getElementById('detailModal').classList.add('active');
            };

            window.closeDetailModal = function() {
                document.getElementById('detailModal').classList.remove('active');
            };

            window.placeOrderFromDetail = function() {
                document.getElementById('detailOrderBtn').click();
            };

            function escapeHtml(t) {
                const d = document.createElement('div');
                d.textContent = t || '';
                return d.innerHTML;
            }

            loadProducts();
        })();
    </script>
</body>
</html>
