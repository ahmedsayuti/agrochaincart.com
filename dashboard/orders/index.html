<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Orders — AgroChain Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --forest: #1a3a2a; --grove: #2d6a4f; --leaf: #40916c; --sage: #74c69d;
            --mist: #d8f3dc; --cream: #f8faf4; --smoke: #4a5e52;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--cream); padding: 40px 5%; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 16px; border: 1px solid #e8f0eb; }
        h2 { color: var(--forest); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #e8f0eb; text-align: left; }
        .status-select { padding: 4px 8px; border-radius: 6px; border: 1px solid #ddeee4; }
        .btn-back { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Your Orders</h2>
        <div id="ordersContainer">Loading...</div>
        <a href="/dashboard/" class="btn-back">← Back to Dashboard</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabase.createClient(
            'https://kuwoqzdgndnnayxrbzll.supabase.co',
            'sb_publishable_jA1Bj9q3UEQbNOrDqn-0Wg_VxcviUCE'
        );

        async function loadOrders() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { window.location.href = '/sign-in/'; return; }

            const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
            const role = profile?.role;

            let query;
            if (role === 'farmer') {
                query = supabase.from('orders').select('id, quantity, total_price, status, created_at, listings!inner(title, unit), profiles!inner(first_name, last_name)')
                    .eq('listings.farmer_id', user.id)
                    .order('created_at', { ascending: false });
            } else {
                query = supabase.from('orders').select('id, quantity, total_price, status, created_at, listings(title, unit)')
                    .eq('buyer_id', user.id)
                    .order('created_at', { ascending: false });
            }

            const { data: orders } = await query;
            const container = document.getElementById('ordersContainer');

            if (!orders || orders.length === 0) {
                container.innerHTML = '<div class="card">No orders found.</div>';
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="card">
                    <strong>${escapeHtml(o.listings.title)}</strong> — ${o.quantity} ${o.listings.unit}<br>
                    Total: $${o.total_price} — ${new Date(o.created_at).toLocaleDateString()}<br>
                    ${role === 'farmer' ? `
                        Status:
                        <select class="status-select" onchange="updateStatus('${o.id}', this.value)">
                            <option ${o.status==='pending'?'selected':''}>pending</option>
                            <option ${o.status==='confirmed'?'selected':''}>confirmed</option>
                            <option ${o.status==='shipped'?'selected':''}>shipped</option>
                            <option ${o.status==='delivered'?'selected':''}>delivered</option>
                            <option ${o.status==='cancelled'?'selected':''}>cancelled</option>
                        </select>
                    ` : `Status: ${o.status}`}
                </div>
            `).join('');
        }

        window.updateStatus = async (orderId, newStatus) => {
            await supabase.from('orders').update({ status: newStatus }).eq('id', orderId);
            alert('Status updated.');
        };

        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t||''; return d.innerHTML; }

        loadOrders();
    </script>
</body>
</html>
