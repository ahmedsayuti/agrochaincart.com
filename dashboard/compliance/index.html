<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Compliance — AgroChain Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8faf4; padding: 40px 5%; }
    </style>
</head>
<body>
    <h2>Compliance Documents</h2>
    <input type="file" id="fileInput" />
    <button onclick="uploadFile()">Upload</button>
    <ul id="fileList"></ul>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabase.createClient(
            'https://kuwoqzdgndnnayxrbzll.supabase.co',
            'sb_publishable_jA1Bj9q3UEQbNOrDqn-0Wg_VxcviUCE'
        );
        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert('Select a file');
            const { data, error } = await supabase.storage.from('compliance-docs').upload(
                `${Date.now()}_${file.name}`, file
            );
            if (error) alert(error.message);
            else alert('Uploaded!');
        }
    </script>
</body>
</html>
