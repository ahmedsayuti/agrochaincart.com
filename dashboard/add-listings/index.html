<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Listing — AgroChain Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8faf4;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .form-card {
            background: white; padding: 40px; border-radius: 20px;
            max-width: 520px; width: 90%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.05);
        }
        h2 { color: #1a3a2a; margin-bottom: 20px; }
        label { display: block; margin: 12px 0 4px; font-weight: 600; color: #1a3a2a; }
        input, select, textarea {
            width: 100%; padding: 10px; border-radius: 8px;
            border: 1.5px solid #ddeee4; font-family: inherit;
        }
        .image-upload {
            border: 2px dashed #c0d5c8; border-radius: 12px;
            padding: 20px; text-align: center; cursor: pointer;
            margin-top: 8px; transition: background 0.2s;
        }
        .image-upload:hover { background: #f0f7f2; }
        .image-upload p { margin: 0; font-size: 0.9rem; color: #4a5e52; }
        #fileInput { display: none; }
        .preview {
            max-width: 100%; max-height: 200px; margin-top: 12px;
            border-radius: 8px; display: none;
        }
        button {
            background: #2d6a4f; color: white; border: none;
            padding: 12px 24px; border-radius: 10px; cursor: pointer;
            font-weight: 700; width: 100%; margin-top: 20px;
        }
        button:hover { background: #1a3a2a; }
        .back-link { display: block; text-align: center; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Add New Listing</h2>
        <form id="listingForm">
            <label>Title *</label>
            <input type="text" name="title" required placeholder="e.g., Heirloom Tomatoes">

            <label>Category *</label>
            <select name="category">
                <option value="vegetables">Vegetables</option>
                <option value="fruits">Fruits</option>
                <option value="dairy">Dairy</option>
                <option value="grains">Grains</option>
            </select>

            <div style="display:flex; gap:12px;">
                <div style="flex:1;">
                    <label>Price ($) *</label>
                    <input type="number" step="0.01" name="price" required placeholder="0.00">
                </div>
                <div style="flex:1;">
                    <label>Unit *</label>
                    <input type="text" name="unit" required placeholder="lb, dozen...">
                </div>
            </div>

            <label>Quantity Available *</label>
            <input type="number" name="quantity" required placeholder="e.g., 50">

            <label>Description (optional)</label>
            <textarea name="description" rows="2" placeholder="Brief description..."></textarea>

            <label>Product Image (optional)</label>
            <div class="image-upload" id="dropArea" onclick="document.getElementById('fileInput').click()">
                <p>📸 Click or drag image here</p>
                <p style="font-size:0.8rem; color:#8fac9e;">JPG, PNG – Max 5MB</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
            <img id="previewImg" class="preview" alt="Preview">

            <button type="submit">Create Listing 🌱</button>
        </form>
        <a href="/dashboard/" class="back-link">← Back to Dashboard</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabase.createClient(
            'https://kuwoqzdgndnnayxrbzll.supabase.co',
            'sb_publishable_jA1Bj9q3UEQbNOrDqn-0Wg_VxcviUCE'
        );

        let selectedFile = null;

        window.handleFileSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedFile = file;
            // Preview
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('previewImg');
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        };

        // Drag & drop support
        const dropArea = document.getElementById('dropArea');
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.style.background = '#edfbf2';
        });
        dropArea.addEventListener('dragleave', () => {
            dropArea.style.background = '';
        });
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.style.background = '';
            const file = e.dataTransfer.files[0];
            if (!file) return;
            selectedFile = file;
            document.getElementById('fileInput').files = e.dataTransfer.files; // sync input
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('previewImg').src = ev.target.result;
                document.getElementById('previewImg').style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('listingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { alert('Please sign in.'); return; }

            const form = new FormData(e.target);
            let imageUrl = null;

            if (selectedFile) {
                const fileExt = selectedFile.name.split('.').pop();
                const filePath = `${user.id}/${Date.now()}.${fileExt}`;
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('listing-images')
                    .upload(filePath, selectedFile, {
                        cacheControl: '3600',
                        upsert: false
                    });

                if (uploadError) {
                    alert('Image upload failed: ' + uploadError.message);
                    return;
                }

                // Get public URL
                const { data: { publicUrl } } = supabase.storage
                    .from('listing-images')
                    .getPublicUrl(filePath);
                imageUrl = publicUrl;
            }

            const listingData = {
                farmer_id: user.id,
                title: form.get('title'),
                category: form.get('category'),
                price: parseFloat(form.get('price')),
                unit: form.get('unit'),
                quantity_available: parseInt(form.get('quantity')),
                description: form.get('description'),
                image_url: imageUrl
            };

            const { error: insertError } = await supabase.from('listings').insert([listingData]);
            if (insertError) alert('Error creating listing: ' + insertError.message);
            else {
                alert('Listing created successfully!');
                window.location.href = '/dashboard/';
            }
        });
    </script>
</body>
</html>
