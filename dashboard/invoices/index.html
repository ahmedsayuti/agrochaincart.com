<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Invoices — AgroChain Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8faf4; padding: 40px 5%; }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container" style="max-width:800px;margin:0 auto;">
        <h2>Invoice History</h2>
        <div id="invoices">Loading...</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabase.createClient(
            'https://kuwoqzdgndnnayxrbzll.supabase.co',
            'sb_publishable_jA1Bj9q3UEQbNOrDqn-0Wg_VxcviUCE'
        );
        async function loadInvoices() {
            const { data: { user } } = await supabase.auth.getUser();
            const { data: orders } = await supabase.from('orders')
                .select('id, quantity, total_price, status, created_at, listings(title, unit)')
                .eq('buyer_id', user.id)
                .order('created_at', { ascending: false });
            const html = orders?.map(o => `
                <div class="card">
                    <strong>${o.listings.title}</strong> — ${o.quantity} ${o.listings.unit}<br>
                    Total: $${o.total_price} — ${new Date(o.created_at).toLocaleDateString()}<br>
                    Status: ${o.status}
                </div>
            `).join('') || '<p>No invoices.</p>';
            document.getElementById('invoices').innerHTML = html;
        }
        loadInvoices();
    </script>
</body>
</html>
