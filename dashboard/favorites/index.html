<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Favorites — AgroChain Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8faf4; padding: 40px 5%; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #e8f0eb; }
        .remove-btn { background: #c0392b; color: white; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Favorite Farmers</h2>
        <div id="favList">Loading...</div>
        <a href="/dashboard/">← Back</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabase.createClient(
            'https://kuwoqzdgndnnayxrbzll.supabase.co',
            'sb_publishable_jA1Bj9q3UEQbNOrDqn-0Wg_VxcviUCE'
        );

        async function loadFavorites() {
            const { data: { user } } = await supabase.auth.getUser();
            const { data: favs } = await supabase.from('favorites')
                .select('farmer_id, profiles!inner(first_name, last_name, state)')
                .eq('buyer_id', user.id);

            const list = document.getElementById('favList');
            if (!favs || favs.length === 0) {
                list.innerHTML = '<p>No favorites yet. <a href="/marketplace/">Browse farmers</a>.</p>';
                return;
            }
            list.innerHTML = favs.map(f => `
                <div class="card">
                    <strong>${f.profiles.first_name} ${f.profiles.last_name}</strong> — ${f.profiles.state}
                    <button class="remove-btn" onclick="remove('${f.farmer_id}')">Remove</button>
                </div>
            `).join('');
        }

        window.remove = async (farmerId) => {
            const { error } = await supabase.from('favorites').delete()
                .eq('buyer_id', (await supabase.auth.getUser()).data.user.id)
                .eq('farmer_id', farmerId);
            if (!error) loadFavorites();
        };

        loadFavorites();
    </script>
</body>
</html>
